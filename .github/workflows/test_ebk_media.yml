name: Test EBK media builders
on:
  push:
    branches: [main]
    paths:
      - 'docs/EBK/**/tools/**'
      - 'tests/**'
      - '.github/workflows/ebk_project_275fcf6a380e5388.yml'
      - '.github/workflows/test_ebk_media.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'docs/EBK/**/tools/**'
      - 'tests/**'
      - '.github/workflows/ebk_project_275fcf6a380e5388.yml'
      - '.github/workflows/test_ebk_media.yml'
      - '.gitignore'
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - name: Check syntax without writing bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for pattern in ('docs/EBK/projects/*/tools/*.py', 'docs/EBK/venues/*/tools/*.py', 'tests/*.py'):
              for path in Path('.').glob(pattern):
                  ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          PY
